# /etc/nginx/sites-available/n-a.mein.tn
# Site statique : Nginx sert directement les fichiers, aucun port ni service à lancer.

server {
    listen 80;
    listen [::]:80;
    server_name n-a.mein.tn;

    root /opt/nour/site;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/html text/css application/javascript image/svg+xml;

    # Images et musique : gardées 30 jours chez les invités
    location ~* \.(webp|png|jpg|jpeg|svg|woff2|mp3)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # La page : toujours revérifiée, pour que les modifications apparaissent tout de suite
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
